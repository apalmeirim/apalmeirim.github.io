<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>me</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <main class="center">
      <section class="about-card" aria-label="Me">
        <p class="about-copy contact-intro">
          <em>software engineer</em>, currently working @ Accenture.
        </p>
        <nav class="contact-icons" aria-label="Contact links">
          <button class="contact-icon-btn" type="button" data-copy="antonioplr@pm.me" aria-label="email">
            <img class="contact-icon" src="../../images/email-png.png" alt="" />
          </button>
          <button class="contact-icon-btn" type="button" data-copy="+351 925 307 378" aria-label="phone">
            <img class="contact-icon" src="../../images/phone-png.png" alt="" />
          </button>
          <a class="contact-icon-btn" href="https://www.linkedin.com/in/antonio-palmeirim-912200265/" target="_blank" rel="noreferrer" aria-label="linkedin">
            <img class="contact-icon" src="../../images/linkednin-png.png" alt="" />
          </a>
          <a class="contact-icon-btn" href="../../misc/cv2026_02.pdf" download aria-label="download cv">
            <img class="contact-icon" src="../../images/cv-png.png" alt="" />
          </a>
        </nav>
        <p class="contact-reveal" id="contact-reveal" aria-live="polite"></p>
      </section>
      <div class="page-footer">
        <a class="icon-button" href="../" aria-label="back">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <button class="icon-button site-theme-toggle" id="site-theme-toggle" type="button" aria-label="switch to dark mode">
          <span class="site-theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
    </main>

    <script src="../../script.js"></script>
    <script>
      const revealButtons = document.querySelectorAll("[data-copy]");
      const reveal = document.getElementById("contact-reveal");
      let hideTimer = null;
      let currentValue = "";

      function hideReveal() {
        clearTimeout(hideTimer);
        hideTimer = null;
        currentValue = "";
        reveal.textContent = "";
      }

      function showValue(value) {
        clearTimeout(hideTimer);
        currentValue = value;
        reveal.textContent = value;
        hideTimer = setTimeout(hideReveal, 5000);
      }

      revealButtons.forEach((button) => {
        button.addEventListener("click", () => {
          showValue(button.getAttribute("data-copy") || "");
        });
      });

      reveal.addEventListener("click", async () => {
        if (!currentValue) return;

        try {
          await navigator.clipboard.writeText(currentValue);
          reveal.textContent = "copied";
          clearTimeout(hideTimer);
          hideTimer = setTimeout(hideReveal, 5000);
          setTimeout(() => {
            if (reveal.textContent === "copied") {
              reveal.textContent = currentValue;
            }
          }, 900);
        } catch {
          /* clipboard unavailable; value stays visible to copy manually */
        }
      });
    </script>
  </body>
</html>
