<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>archive</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="center about-layout">
      <section class="about-card" aria-label="Archive">
        <p class="about-copy">digital archive.</p>
        <nav class="links" aria-label="Archive links">
          <a class="link" href="files/" data-shortcut-key="f">files</a>
          <span class="link link-disabled" aria-disabled="true">photos</span>
          <span class="link link-disabled" aria-disabled="true">music</span>
        </nav>
      </section>
      <div class="page-footer">
        <a class="icon-button" href="../main/" aria-label="back">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <button class="icon-button site-theme-toggle" id="site-theme-toggle" type="button" aria-label="switch to dark mode">
          <span class="site-theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
