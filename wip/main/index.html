<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>main</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main class="center">
      <section class="about-card">
        <p class="title-smile" aria-hidden="true">/main</p>
        <nav class="links" aria-label="Primary">
          <a class="link" href="../archive/" data-shortcut-key="a">.archive</a>
          <a class="link" href="../about/" data-shortcut-key="b">.about</a>
        </nav>
      </section>
      <div class="page-footer">
        <button class="icon-button site-theme-toggle" id="site-theme-toggle" type="button" aria-label="switch to dark mode">
          <span class="site-theme-toggle-icon" aria-hidden="true"></span>
        </button>
        <a class="icon-button" href="../clock/" aria-label="clock">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
        </a>
        <div class="sound-control">
          <button class="icon-button sound-toggle" id="sound-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="sound menu">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9"></polygon>
              <path class="wave" d="M16 8a5 5 0 0 1 0 8"></path>
              <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13"></path>
            </svg>
          </button>
          <div class="sound-menu" id="sound-menu" hidden>
            <button class="sound-menu-item sound-menu-off" type="button" data-track="0" aria-label="sound off">0</button>
            <button class="sound-menu-item" type="button" data-track="1" aria-label="sound 1">1</button>
            <button class="sound-menu-item" type="button" data-track="2" aria-label="sound 2">2</button>
            <button class="sound-menu-item" type="button" data-track="3" aria-label="sound 3">3</button>
            <button class="sound-menu-item" type="button" data-track="4" aria-label="sound 4">4</button>
            <button class="sound-menu-item" type="button" data-track="5" aria-label="sound 5">5</button>
          </div>
        </div>
      </div>
      <audio id="site-sound-audio" loop preload="none"></audio>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
